# Configuraci\u00f3n del Servidor y Puerto
server.port=8080

# Configuraci\u00f3n de Conexi\u00f3n a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sherlock_homes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuario y Contrase\u00f1a de MySQL Workbench 
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.check-template-location=false